<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in | Authly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { ink: '#172033', mist: '#f6f8fc', accent: '#5468ff' },
            boxShadow: { card: '0 24px 70px rgba(57, 72, 112, .12)' }
          }
        }
      };
    </script>
  </head>
  <body class="min-h-screen bg-mist text-ink antialiased">
    <main class="flex min-h-screen items-center justify-center px-5 py-10">
      <section class="w-full max-w-md rounded-[2rem] bg-white p-8 shadow-card sm:p-10">
        <a href="index.html" class="text-sm font-bold tracking-wide text-accent">AUTHLY</a>
        <div class="mt-10">
          <p class="text-sm font-semibold uppercase tracking-[0.2em] text-slate-400">Welcome back</p>
          <h1 class="mt-3 text-3xl font-black tracking-tight">Log in to your account</h1>
          <p class="mt-3 text-slate-500">Use your username and password to continue.</p>
          <p data-auth-notice class="mt-5 hidden rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-bold text-emerald-700"></p>
        </div>

        <form data-auth-form data-endpoint="/api/login" data-action="Log in" class="mt-8 space-y-5" novalidate>
          <div>
            <label for="username" class="mb-2 block text-sm font-bold text-slate-700">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none transition focus:border-accent focus:ring-4 focus:ring-indigo-100" />
          </div>
          <div>
            <label for="password" class="mb-2 block text-sm font-bold text-slate-700">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none transition focus:border-accent focus:ring-4 focus:ring-indigo-100" />
          </div>
          <p data-error role="alert" class="hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700"></p>
          <button type="submit" class="w-full rounded-xl bg-accent px-5 py-3.5 font-bold text-white transition hover:bg-indigo-600 focus:outline-none focus:ring-4 focus:ring-indigo-200 disabled:cursor-wait disabled:opacity-60">Log in</button>
        </form>

        <p class="mt-8 text-center text-sm text-slate-500">New here? <a href="signup.html" class="font-bold text-accent hover:underline">Create an account</a></p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
