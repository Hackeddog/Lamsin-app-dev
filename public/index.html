<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | Authly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { ink: '#172033', mist: '#f6f8fc', accent: '#5468ff' },
            boxShadow: { card: '0 24px 70px rgba(57, 72, 112, .12)' }
          }
        }
      };
    </script>
  </head>
  <body class="min-h-screen bg-mist text-ink antialiased">
    <main class="relative flex min-h-screen items-center justify-center overflow-hidden px-5 py-10">
      <div class="absolute -left-20 -top-20 h-72 w-72 rounded-full bg-indigo-200/60 blur-3xl"></div>
      <div class="absolute -bottom-24 -right-12 h-80 w-80 rounded-full bg-blue-200/50 blur-3xl"></div>
      <section class="relative w-full max-w-2xl rounded-[2rem] bg-white p-8 text-center shadow-card sm:p-14">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-indigo-50 text-2xl text-accent">✓</div>
        <p class="mt-8 text-sm font-bold uppercase tracking-[0.22em] text-accent">Authentication complete</p>
        <h1 class="mt-4 text-4xl font-black tracking-tight sm:text-5xl">RestAPI-Activity</h1>
        <p data-current-user class="mt-4 text-lg text-slate-500">Authentication demo</p>
        <p data-auth-notice class="mx-auto mt-6 hidden rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-bold text-emerald-700"></p>
        <p class="mx-auto mt-8 max-w-md leading-7 text-slate-500">This homepage is reached after a successful signup or login request.</p>
        <div class="mt-10 flex flex-col justify-center gap-3 sm:flex-row">
          <a href="signup.html" class="rounded-xl bg-accent px-6 py-3 font-bold text-white transition hover:bg-indigo-600">Create another account</a>
          <a href="login.html" class="rounded-xl border border-slate-200 px-6 py-3 font-bold text-slate-700 transition hover:bg-slate-50">Log in</a>
          <button id="exitButton" type="button" class="rounded-xl border border-red-200 px-6 py-3 font-bold text-red-600 transition hover:bg-red-50">Exit</button>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
